name: Build & Release

# Builds the portable lgpd archives on their native platforms for every
# supported branch/PR. Publishing is an explicit workflow dispatch from the
# exact master commit: VERSION supplies the SemVer tag and CHANGELOG.md records
# the release. The draft is downloaded and verified before it becomes public.

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Publish the current master version as a prerelease."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release contract
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source release identity
        id: identity
        run: |
          set -euo pipefail
          version="$(python3 scripts/check-release-contract.py)"
          python3 scripts/check-release-contract.py --tag "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Require an unpublished release from exact master
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = true
          test "$GITHUB_REF" = refs/heads/master
          remote_master="$(git ls-remote origin refs/heads/master | cut -f1)"
          test -n "$remote_master"
          test "$remote_master" = "$GITHUB_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "refusing to overwrite existing tag $TAG" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "refusing to overwrite existing release $TAG" >&2
            exit 1
          fi

  build-appimage:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-latest
            machine: x86_64
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: logos-co
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build cli-appimage
        run: nix build .#cli-appimage -L

      - name: Package AppImage as tarball
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          arch_short="${arch%%-*}"
          src="$(find result/ -name '*.AppImage' -print -quit)"
          test -n "$src"
          cp "$src" "lgpd-${arch_short}.AppImage"
          chmod +x "lgpd-${arch_short}.AppImage"
          tar -czf "lgpd-${arch_short}-linux.tar.gz" "lgpd-${arch_short}.AppImage"

      - name: Smoke packaged AppImage on native runner
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          archive="$(find . -maxdepth 1 -name 'lgpd-*-linux.tar.gz' -print -quit)"
          test -n "$archive"
          extract="$RUNNER_TEMP/lgpd-linux-smoke"
          mkdir "$extract"
          tar -xzf "$archive" -C "$extract"
          binary="$(find "$extract" -name '*.AppImage' -print -quit)"
          test -n "$binary"
          output="$(APPIMAGE_EXTRACT_AND_RUN=1 "$binary" --version)"
          printf '%s\n' "$output"
          grep -F "lgpd version $EXPECTED_VERSION" <<<"$output"
          grep -F "commit: $EXPECTED_COMMIT" <<<"$output"

      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: lgpd-*-linux.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-macos-bundle:
    needs: validate
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v15
        with:
          name: logos-co
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build cli-bundle-dir
        run: nix build .#cli-bundle-dir -L

      - name: Package bundle as tarball
        run: |
          set -euo pipefail
          dst="lgpd-aarch64-macos"
          mkdir "$dst"
          cp -RL result/. "$dst/"
          chmod -R u+w "$dst"
          # Keep the portable archive free of browser-style quarantine metadata.
          /usr/bin/xattr -r -d com.apple.quarantine "$dst" 2>/dev/null || true
          tar -czf "$dst.tar.gz" "$dst"

      - name: Smoke packaged bundle on Apple Silicon
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          extract="$RUNNER_TEMP/lgpd-macos-smoke"
          mkdir "$extract"
          tar -xzf lgpd-aarch64-macos.tar.gz -C "$extract"
          binary="$extract/lgpd-aarch64-macos/bin/lgpd"
          test -x "$binary"
          output="$("$binary" --version)"
          printf '%s\n' "$output"
          grep -F "lgpd version $EXPECTED_VERSION" <<<"$output"
          grep -F "commit: $EXPECTED_COMMIT" <<<"$output"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64-darwin
          path: lgpd-aarch64-macos.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, build-appimage, build-macos-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: appimage-x86_64-linux
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: appimage-aarch64-linux
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: macos-aarch64-darwin
          path: artifacts/

      - name: Verify complete artifact set and write checksums
        run: |
          set -euo pipefail
          cd artifacts
          test -f lgpd-x86_64-linux.tar.gz
          test -f lgpd-aarch64-linux.tar.gz
          test -f lgpd-aarch64-macos.tar.gz
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" = 3
          sha256sum \
            lgpd-x86_64-linux.tar.gz \
            lgpd-aarch64-linux.tar.gz \
            lgpd-aarch64-macos.tar.gz \
            > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Write release notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          # lgpd $VERSION

          **Channel:** Alpha

          Portable archives are built and smoke-tested on their native runners:

          - Linux x86_64 AppImage
          - Linux ARM64 AppImage
          - Apple Silicon macOS bundle

          SHA256SUMS authenticates the exact uploaded archives. See
          CHANGELOG.md in tag $TAG for release details.
          EOF

      - name: Atomically claim exact release tag
        id: claim_tag
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG" "$GITHUB_SHA"
          git push --atomic origin "refs/tags/$TAG:refs/tags/$TAG"
          printf 'owned=true\nexpected_oid=%s\n' \
            "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Create owned draft release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/lgpd-release-payload.json"
          jq -n \
            --arg tag "$TAG" \
            --arg commit "$GITHUB_SHA" \
            --arg name "lgpd $VERSION (Alpha)" \
            --rawfile body release-notes.md \
            '{
              tag_name: $tag,
              target_commitish: $commit,
              name: $name,
              body: $body,
              draft: true,
              prerelease: true,
              make_latest: "false"
            }' > "$payload"
          response="$(gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases" --input "$payload")"
          release_id="$(jq -er '.id | tostring' <<<"$response")"
          printf 'release_id=%s\nowned=true\n' \
            "$release_id" >> "$GITHUB_OUTPUT"
          jq -e \
            --arg tag "$TAG" \
            --arg commit "$GITHUB_SHA" \
            '.tag_name == $tag
              and .target_commitish == $commit
              and .draft == true
              and .prerelease == true' \
            <<<"$response" >/dev/null

      - name: Upload assets to exact owned draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          for asset in \
            artifacts/lgpd-x86_64-linux.tar.gz \
            artifacts/lgpd-aarch64-linux.tar.gz \
            artifacts/lgpd-aarch64-macos.tar.gz \
            artifacts/SHA256SUMS
          do
            name="${asset##*/}"
            encoded_name="$(jq -nr --arg value "$name" '$value | @uri')"
            response="$(curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Content-Type: application/octet-stream" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary "@$asset" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$encoded_name")"
            jq -e --arg name "$name" \
              '.name == $name and .state == "uploaded"' \
              <<<"$response" >/dev/null
          done

      - name: Verify exact draft, assets, and Linux runtime
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          release="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          jq -e \
            --argjson id "$RELEASE_ID" \
            --arg tag "$TAG" \
            --arg commit "$GITHUB_SHA" \
            '.id == $id
              and .tag_name == $tag
              and .target_commitish == $commit
              and .draft == true
              and .prerelease == true' \
            <<<"$release" >/dev/null

          assets="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100")"
          test "$(jq 'length' <<<"$assets")" = 4
          expected_names="$(printf '%s\n' \
            lgpd-x86_64-linux.tar.gz \
            lgpd-aarch64-linux.tar.gz \
            lgpd-aarch64-macos.tar.gz \
            SHA256SUMS | sort)"
          actual_names="$(jq -r '.[].name' <<<"$assets" | sort)"
          test "$actual_names" = "$expected_names"

          mkdir published-artifacts
          while IFS=$'\t' read -r asset_id asset_name; do
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --location \
              --header "Accept: application/octet-stream" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "published-artifacts/$asset_name" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done < <(jq -r '.[] | [.id, .name] | @tsv' <<<"$assets")
          (
            cd published-artifacts
            test "$(find . -maxdepth 1 -type f | wc -l)" = 4
            sha256sum -c SHA256SUMS
          )

          mkdir published-linux
          tar -xzf published-artifacts/lgpd-x86_64-linux.tar.gz \
            -C published-linux
          binary="$(find published-linux -name '*.AppImage' -print -quit)"
          test -n "$binary"
          output="$(APPIMAGE_EXTRACT_AND_RUN=1 "$binary" --version)"
          printf '%s\n' "$output"
          grep -F "lgpd version $VERSION" <<<"$output"
          grep -F "commit: $GITHUB_SHA" <<<"$output"

      - name: Publish exact verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
          TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.claim_tag.outputs.expected_oid }}
        run: |
          set -euo pipefail
          remote_oid="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
          test "$remote_oid" = "$EXPECTED_COMMIT"
          response="$(jq -n \
            '{draft: false, prerelease: true, make_latest: "false"}' |
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --input -)"
          jq -e \
            --argjson id "$RELEASE_ID" \
            --arg tag "$TAG" \
            '.id == $id
              and .tag_name == $tag
              and .draft == false
              and .prerelease == true' \
            <<<"$response" >/dev/null
          remote_oid="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
          test "$remote_oid" = "$EXPECTED_COMMIT"

      - name: Roll back only owned draft and exact tag
        if: failure() && steps.claim_tag.outputs.owned == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
          RELEASE_OWNED: ${{ steps.create_release.outputs.owned }}
          TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.claim_tag.outputs.expected_oid }}
        run: |
          set -uo pipefail
          cleanup_failed=0
          can_delete_tag=false

          if test "$RELEASE_OWNED" = true && test -n "$RELEASE_ID"; then
            if release="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" 2>/dev/null)"
            then
              if jq -e \
                --argjson id "$RELEASE_ID" \
                --arg tag "$TAG" \
                --arg commit "$EXPECTED_COMMIT" \
                '.id == $id
                  and .tag_name == $tag
                  and .target_commitish == $commit
                  and .draft == true' \
                <<<"$release" >/dev/null
              then
                if gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                  >/dev/null
                then
                  can_delete_tag=true
                else
                  cleanup_failed=1
                fi
              else
                cleanup_failed=1
              fi
            else
              cleanup_failed=1
            fi
          elif test "$RELEASE_OWNED" != true && test -z "$RELEASE_ID"; then
            can_delete_tag=true
          else
            cleanup_failed=1
          fi

          tag_referenced=unknown
          if release_tags="$(gh api --paginate \
            --jq '.[].tag_name' \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          then
            if grep -Fxq "$TAG" <<<"$release_tags"; then
              tag_referenced=true
            else
              tag_referenced=false
            fi
          else
            cleanup_failed=1
          fi

          remote_oid="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
          if test "$can_delete_tag" = true &&
            test "$tag_referenced" = false &&
            test "$remote_oid" = "$EXPECTED_COMMIT"
          then
            git push \
              --force-with-lease="refs/tags/$TAG:$EXPECTED_COMMIT" \
              origin ":refs/tags/$TAG" || cleanup_failed=1
          fi

          exit "$cleanup_failed"
